openapi: 3.0.3
info:
  title: OneLinkAI 软件更新 API
  version: 1.0.0
  description: macOS 使用 JSON 版本接口及 DMG，Windows 使用 YAML 清单及 NSIS EXE。匿名 HTTPS 访问。
servers:
  - url: https://www.onelinkai.cloud
security: []
paths:
  /api/desktop-updates/latest:
    get:
      operationId: getMacRelease
      summary: macOS 查询最新版本
      parameters:
        - name: platform
          in: query
          required: true
          schema:
            type: string
            enum: [darwin]
        - name: arch
          in: query
          required: true
          schema:
            type: string
            enum: [arm64, x64]
        - name: currentVersion
          in: query
          required: true
          schema:
            type: string
            example: 0.3.2
      responses:
        '200':
          description: Cache-Control 为 no-cache。有更新时 downloadUrl 必填；无更新可仅返回当前 version。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/MacRelease'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/MacRelease'
              example:
                version: 0.3.3
                downloadUrl: https://example.com/downloads/OneLinkAI-0.3.3-arm64.dmg
                releaseNotes: 修复已知问题
        '204':
          description: 无更新。
        '404':
          description: 对应架构尚未发布。
        '503':
          description: 服务暂不可用。
  /api/desktop-updates/stable/win32/{arch}/latest.yml:
    parameters:
      - $ref: '#/components/parameters/WindowsArch'
    get:
      operationId: getWindowsRelease
      summary: Windows 查询最新版本
      responses:
        '200':
          description: Cache-Control 为 no-cache。已是最新也返回清单，由客户端比较版本。
          content:
            application/yaml:
              schema:
                $ref: '#/components/schemas/WindowsManifest'
        '404':
          description: 对应架构尚未发布。
        '503':
          description: 服务暂不可用。
  /api/desktop-updates/stable/win32/{arch}/{filename}:
    parameters:
      - $ref: '#/components/parameters/WindowsArch'
      - name: filename
        in: path
        required: true
        schema:
          type: string
        description: 清单引用的完整 NSIS EXE 文件名。
    get:
      operationId: downloadWindowsPackage
      summary: 下载 Windows 安装包
      description: 返回准确 Content-Length；版本化文件使用 public, max-age=31536000, immutable 缓存。macOS 的 downloadUrl 遵循相同下载规范。
      responses:
        '200':
          description: 完整安装包。
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Range 部分内容。
        '404':
          description: 文件不存在。
        '503':
          description: 服务暂不可用。
    head:
      operationId: headWindowsPackage
      summary: 获取安装包响应头
      responses:
        '200':
          description: 包含 Content-Length，无正文。
        '404':
          description: 文件不存在。
        '503':
          description: 服务暂不可用。
components:
  parameters:
    WindowsArch:
      name: arch
      in: path
      required: true
      schema:
        type: string
        enum: [x64, arm64, ia32]
  schemas:
    MacRelease:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: SemVer 正式版本号。
          example: 0.3.3
        downloadUrl:
          type: string
          description: 有更新时必填，与官网下载共用的 DMG 地址；HTTPS 绝对地址或接口相对地址。
        releaseNotes:
          type: string
        sha512:
          type: string
          description: 最终 DMG 的 SHA512，Base64 编码。
        sha256:
          type: string
          pattern: '^[a-fA-F0-9]{64}$'
        size:
          type: integer
          format: int64
          minimum: 1
        minimumSystemVersion:
          type: string
        releaseDate:
          type: string
          format: date-time
    WindowsManifest:
      type: object
      required: [version, files, path, sha512]
      properties:
        version:
          type: string
          example: 0.3.3
        files:
          type: array
          minItems: 1
          items:
            type: object
            required: [url, sha512, size]
            properties:
              url:
                type: string
                description: 同目录的完整 NSIS EXE 文件名。
              sha512:
                type: string
                description: 最终 EXE 的 SHA512，Base64 编码。
              size:
                type: integer
                format: int64
                minimum: 1
        path:
          type: string
          description: 与 files 中的安装包文件名一致。
        sha512:
          type: string
          description: 与 files 中的 SHA512 一致。
        releaseNotes:
          type: string
        releaseDate:
          type: string
          format: date-time
        minimumSystemVersion:
          type: string
